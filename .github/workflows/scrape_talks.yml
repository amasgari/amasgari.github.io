name: Scrape Talk Locations

on:
  workflow_dispatch: # Allows manual run only


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # This workflow pushes to the repository

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'   # Specify the Python version you need

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install frontmatter getorg geopy

    - name: Regenerate talk map data
      run: |
        python talkmap.py

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Automated update of talk locations" || echo "No changes to commit"
        git push
